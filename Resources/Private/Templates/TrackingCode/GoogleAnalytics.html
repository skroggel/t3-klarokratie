<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

    <f:comment><!-- see: https://developers.google.com/tag-platform/security/guides/consent?consentmode=advanced&hl=de#gtag.js_1 --></f:comment>
    
    <f:comment><!-- for old implementations. Beyond that it's useless--></f:comment>
    <template id="tx-klarokratie-tracking-script" data-injected="1" ></template>

    <!-- Google Code start -->
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('set', 'ads_data_redaction', true);
        gtag('consent', 'default', {
            'analytics_storage': 'denied',
            'ad_storage': 'denied',
            'ad_user_data': 'denied',
            'ad_personalization': 'denied',
            'functionality_storage': 'denied',
            'personalization_storage': 'denied',
            'security_storage' : 'denied',
            'wait_for_update': 500,
        })
    </script>


    <f:if condition="{settings.googleAnalytics.useTagManager}">
        <f:then>
            <f:comment><!-- Special injection --></f:comment>
            <template
                data-klarokratie-type="application/javascript"
                data-klarokratie-name="google-tagmanager"
            >(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
                new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
                j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
                'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
                })(window,document,'script','dataLayer','{settings.googleAnalytics.tagId}');
                // console.log('Google Tag Manager allowed! Thank you!');
            </template>
        </f:then>
        <f:else>
            <template
                data-klarokratie-type="application/javascript"
                data-klarokratie-name="google-analytics"
            >(function(w,d,s,l,i){w[l]=w[l]||[];w.gtag=w.gtag||function(){w[l].push(arguments)};
                var f=d.getElementsByTagName(s)[0],j=d.createElement(s);j.async=true;j.src=
                'https://www.googletagmanager.com/gtag/js?id='+i;f.parentNode.insertBefore(j,f);
                w.gtag('js',new Date());w.gtag('config',i);
                })(window,document,'script','dataLayer','{settings.googleAnalytics.tagId}');
            </template>
            
        </f:else>
    </f:if>
    <!-- Google Code end -->

    <f:render partial="Default" arguments="{_all}" />

</html>
